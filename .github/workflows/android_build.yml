name: Build Android APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Assets
        run: |
          cd client
          # Try custom build first
          node build.js
          # Ensure dist directory has index.html
          cp index.html dist/index.html
          # Fix index.html path for capacitor (remove leading slash if needed)
          sed -i 's/\/dist\/bundle.js/bundle.js/g' dist/index.html

      - name: Capacitor Sync
        run: |
          cd client
          npx cap sync android

      - name: Build with Gradle
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: minecraft-chat-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
