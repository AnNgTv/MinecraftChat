name: Build Android APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Assets (Vite)
        run: |
          cd client
          # Revert index.html change temporarily for Vite build
          sed -i 's/\/dist\/bundle.js/\/src\/main.tsx/g' index.html
          npm run build
          # Revert index.html back for local Termux use (just in case)
          sed -i 's/\/src\/main.tsx/\/dist\/bundle.js/g' index.html

      - name: Capacitor Sync
        run: |
          cd client
          npx cap sync android

      - name: Build with Gradle
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: minecraft-chat-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
